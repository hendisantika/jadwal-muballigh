name: Deploy to Dev Server

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/deploy_dev.yml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'pom.xml'
      - 'nginx/**'

env:
  DEPLOY_DIR: jadwal_muballigh
  IMAGE_NAME: jadwal-muballigh
  IMAGE_TAG: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Save Docker image
        run: docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | gzip > image.tar.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-artifacts
          path: |
            image.tar.gz
            docker-compose.yml
            nginx/jadwalmuballigh.persislabs.my.id.conf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-artifacts

      - name: Prepare SSL certs
        run: |
          mkdir -p ssl
          echo "${{ secrets.CLOUDFLARE_ORIGIN_CERT }}" > ssl/origin.crt
          echo "${{ secrets.CLOUDFLARE_ORIGIN_KEY }}" > ssl/origin.key

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 103.31.204.189
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          target: ~/${{ env.DEPLOY_DIR }}
          source: "image.tar.gz,docker-compose.yml,nginx/jadwalmuballigh.persislabs.my.id.conf,ssl/origin.crt,ssl/origin.key"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          host: 103.31.204.189
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 120s
          command_timeout: 15m
          envs: IMAGE_NAME,IMAGE_TAG
          script: |
            cd ~/${{ env.DEPLOY_DIR }}

            # Create .env file
            cat > .env <<ENVEOF
            APP_SERVER_PORT=${{ vars.APP_SERVER_PORT_DEV }}
            SPRING_DATASOURCE_URL=${{ vars.SPRING_DATASOURCE_URL_DEV }}
            SPRING_DATASOURCE_USERNAME=${{ vars.SPRING_DATASOURCE_USERNAME_DEV }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD_DEV }}
            SPRING_PROFILES_ACTIVE=${{ vars.SPRING_PROFILES_ACTIVE_DEV }}
            IMAGE_NAME=${IMAGE_NAME}
            IMAGE_TAG=${IMAGE_TAG}
            ENVEOF
            sed -i 's/^[[:space:]]*//' .env

            # Install Cloudflare Origin CA cert
            echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S mkdir -p /etc/nginx/ssl
            echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S cp ssl/origin.crt /etc/nginx/ssl/jadwalmuballigh.persislabs.my.id.crt
            echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S cp ssl/origin.key /etc/nginx/ssl/jadwalmuballigh.persislabs.my.id.key
            echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S chmod 600 /etc/nginx/ssl/jadwalmuballigh.persislabs.my.id.key

            # Deploy nginx config
            echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S cp nginx/jadwalmuballigh.persislabs.my.id.conf /etc/nginx/sites-available/jadwalmuballigh.persislabs.my.id.conf
            echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S ln -sf /etc/nginx/sites-available/jadwalmuballigh.persislabs.my.id.conf /etc/nginx/sites-enabled/
            echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S rm -f /etc/nginx/sites-enabled/default
            echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S nginx -t && echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S systemctl reload nginx

            # Load pre-built Docker image
            echo "Loading Docker image..."
            docker load < image.tar.gz

            # Deploy with docker compose
            docker compose down --remove-orphans || true
            docker compose up -d

            # Verify deployment
            sleep 15
            if docker compose ps --format json | grep -q '"running"'; then
              echo "Deployment successful!"
              docker compose ps
            else
              echo "Deployment failed!"
              docker compose logs app
              exit 1
            fi
