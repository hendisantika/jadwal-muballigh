name: Deploy to Dev Server

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/deploy_dev.yml'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'pom.xml'

env:
  DEPLOY_DIR: jadwal_muballigh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-artifacts
          path: |
            target/*.jar
            Dockerfile
            docker-compose.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-artifacts

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 103.31.204.189
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          target: ~/${{ env.DEPLOY_DIR }}
          source: "target/*.jar,Dockerfile,docker-compose.yml"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 103.31.204.189
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 120s
          command_timeout: 15m
          script: |
            cd ~/${{ env.DEPLOY_DIR }}

            # Create .env file with environment variables
            cat > .env << 'ENVEOF'
            APP_SERVER_PORT=${{ vars.APP_SERVER_PORT_DEV }}
            SPRING_DATASOURCE_URL=${{ vars.SPRING_DATASOURCE_URL_DEV }}
            SPRING_DATASOURCE_USERNAME=${{ vars.SPRING_DATASOURCE_USERNAME_DEV }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD_DEV }}
            SPRING_PROFILES_ACTIVE=${{ vars.SPRING_PROFILES_ACTIVE_DEV }}
            ENVEOF

            # Build and deploy with docker compose
            docker compose down || true
            docker compose up -d --build

            # Verify deployment
            sleep 10
            if docker compose ps | grep -q "running"; then
              echo "Deployment successful!"
              docker compose ps
            else
              echo "Deployment failed!"
              docker compose logs app
              exit 1
            fi
