server {
    listen 80;
    listen 443 ssl;

    server_name jadwalmuballigh.persislabs.my.id www.jadwalmuballigh.persislabs.my.id;

    ssl_certificate /etc/nginx/ssl/jadwalmuballigh.persislabs.my.id.crt;
    ssl_certificate_key /etc/nginx/ssl/jadwalmuballigh.persislabs.my.id.key;

    index index.html index.htm;
    access_log /var/log/nginx/jadwalmuballigh.log;
    error_log  /var/log/nginx/jadwalmuballigh-error.log error;

    # Export endpoints need longer timeouts (matches /v1/api/*/export/*)
    location ~ ^/v1/api/.+/export/ {
        proxy_pass http://127.0.0.1:8010;

        # Increase timeouts for large exports (5 minutes)
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;

        # Disable buffering to allow streaming
        proxy_buffering off;
        proxy_request_buffering off;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Regular API endpoints (default timeouts)
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
